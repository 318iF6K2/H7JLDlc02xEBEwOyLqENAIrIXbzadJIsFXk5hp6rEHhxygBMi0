<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Five Nights at Stuarts 2</title>
  <link rel="icon" type="image/png" href="CSNew4.png" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      min-height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    /* Menu Container */
    .menu-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 60px 8%;
      z-index: 2;
    }

    /* Game Title Styling */
    .title-section {
      margin-top: 20px;
    }

    .title-text {
      font-size: 3.8rem;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: 2px;
      color: #3b82f6;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(59, 130, 246, 0.6),
                   0 0 24px rgba(59, 130, 246, 0.3);
    }

    .title-number {
      font-size: 5.5rem;
      font-weight: 900;
      color: #3b82f6;
      margin-top: 10px;
      text-shadow: 0 0 15px rgba(59, 130, 246, 0.7);
    }

    /* Menu Options */
    .options-section {
      margin-bottom: 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .menu-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: color 0.2s, text-shadow 0.2s;
    }

    .menu-btn::before {
      content: '';
      display: inline-block;
      width: 0;
      height: 0;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      border-left: 12px solid transparent;
      transition: border-left-color 0.2s;
    }

    .menu-btn:hover {
      color: #60a5fa;
      text-shadow: 0 0 8px rgba(96, 165, 250, 0.8);
    }

    .menu-btn:hover::before {
      border-left-color: #60a5fa;
    }

    /* Bottom Character Image Overlay */
    .character-overlay {
      position: absolute;
      bottom: -20px;
      right: 4%;
      height: 75vh;
      max-height: 650px;
      z-index: 1;
      pointer-events: none;
      filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.35)) brightness(0.7) contrast(1.1);
    }

    .character-overlay img {
      height: 100%;
      width: auto;
      display: block;
    }

    /* Subtle static vignette effect */
    .vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, transparent 40%, rgba(0, 0, 0, 0.85) 100%);
      pointer-events: none;
      z-index: 3;
    }

    /* Mobile adjustments */
    @media (max-width: 768px) {
      .title-text {
        font-size: 2.5rem;
      }
      .title-number {
        font-size: 4rem;
      }
      .character-overlay {
        height: 50vh;
        right: -10%;
      }
    }
  </style>
</head>
<body>

  <div class="vignette"></div>

  <main class="menu-container">
    <div class="title-section">
      <h1 class="title-text">Five Nights<br>at Stuarts</h1>
      <div class="title-number">2</div>
    </div>

    <div class="options-section">
      <button class="menu-btn" onclick="startGame()">New Game</button>
      <button class="menu-btn" onclick="continueGame()">Continue</button>
    </div>
  </main>

  <div class="character-overlay">
    <img src="image_d92a66.png" alt="Stuart Character" />
  </div>

  <script>
    function startGame() {
      // Redirect or launch game logic here
      console.log("Starting new game...");
    }

    function continueGame() {
      // Load saved state logic here
      console.log("Continuing game...");
    }
  </script>

</body>
</html>
