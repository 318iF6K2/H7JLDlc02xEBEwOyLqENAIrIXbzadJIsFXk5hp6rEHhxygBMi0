<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Five Night's At Stuarts 2</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Creepster&display=swap" rel="stylesheet">
  <style>
    /* ─────────── RESET & BASE ─────────── */
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;background:#000;font-family:'Oswald',sans-serif;overflow:hidden;user-select:none;cursor:none}

    /* ─────────── STATIC OVERLAYS ─────────── */
    #noise,#scanlines,#vignette{position:fixed;inset:0;pointer-events:none;z-index:9}
    #noise{opacity:.035}
    #scanlines{background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.17) 2px 4px);z-index:10}
    #vignette{background:radial-gradient(circle at center,transparent 55%,rgba(0,0,0,.82) 100%);z-index:11}

    /* ─────────── TITLE BLOCK (LEFT) ─────────── */
    .title-block{position:absolute;top:12%;left:6%;display:flex;flex-direction:column;gap:.2em;z-index:20;animation:titleFlicker 7s steps(1,end) infinite}
    @keyframes titleFlicker{0%,97%,100%{opacity:1}98%{opacity:.78}99%{opacity:1}}
    .title-line{font-family:'Creepster',cursive;font-size:clamp(42px,7vw,96px);color:#6bb3ff;letter-spacing:.04em;text-shadow:0 0 34px rgba(80,150,255,.85),3px 3px 0 #042354}
    .title-num{font-family:'Creepster',cursive;font-size:clamp(110px,17vw,220px);line-height:.8;color:#2f7bff;transform:translateX(-8%);text-shadow:0 0 50px rgba(70,140,255,.55)}

    /* ─────────── MENU OPTIONS (BOTTOM-LEFT) ─────────── */
    #menu{position:absolute;bottom:10%;left:6%;list-style:none;display:flex;flex-direction:column;gap:10px;z-index:20}
    #menu li{font-size:clamp(18px,2.6vw,32px);letter-spacing:.45em;text-transform:uppercase;color:#143256;transition:all .16s ease;position:relative}
    #menu li.active{color:#8bc4ff}
    #menu li.active:hover,#menu li.selected{color:#cfe4ff;text-shadow:0 0 12px rgba(140,190,255,.9);cursor:pointer}
    #menu li.inactive{color:#0f2138;cursor:not-allowed}
    #menu li.selected::before{content:'▶';position:absolute;left:-1.6em;color:#cfe4ff;animation:blinkArrow .7s steps(1,end) infinite}
    @keyframes blinkArrow{0%,100%{opacity:1}50%{opacity:0}}

    /* ─────────── HINT / COPYRIGHT ─────────── */
    #hint{position:absolute;bottom:4%;right:6%;font-size:clamp(10px,1.1vw,14px);letter-spacing:.25em;color:#13325c;z-index:20;text-align:right}

    /* ─────────── STUART SILHOUETTE ─────────── */
    .stuart-silhouette{position:absolute;bottom:-5%;right:-2%;width:50vw;max-width:680px;opacity:.55;filter:brightness(.55) sepia(.6) hue-rotate(-170deg) saturate(1.8) drop-shadow(0 0 45px rgba(80,130,255,.45));pointer-events:none;z-index:12}

    /* ─────────── FLASH TRANSITION ─────────── */
    #flash{position:fixed;inset:0;background:#fff;pointer-events:none;opacity:0;z-index:100;transition:opacity .05s}

    /* ─────────── SECRET VIDEO ─────────── */
    #secret-vid{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;z-index:200;background:#000;display:none}

    /* ─────────── GAME CONTAINER ─────────── */
    #game-container{position:absolute;inset:0;display:none}

    /* ─────────── ROOM WRAPPER ─────────── */
    #room-wrapper{position:absolute;top:0;left:0;width:280vw;height:100vh;transform:translateX(-90vw) scale(0.6);transition:transform 0.2s cubic-bezier(0.1,0.4,0.2,1);will-change:transform}
    #room-img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;filter:brightness(0.2);transition:filter 0.05s ease-out}
    #room-img.lit{filter:brightness(0.85)}

    /* ─────────── OFFICE & ANAMATRONIC PEEKS ─────────── */
    .peek-zone{position:fixed;top:20vh;height:60vh;width:18%;z-index:4;pointer-events:none;display:none;object-fit:contain}
    #peek-left{left:10vw}
    #peek-right{right:10vw}
    #peek-center{left:41vw;width:18vw;height:40vh;top:30vh}
    #dark-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);pointer-events:none;z-index:3}

    /* ─────────── MASK SYSTEM ─────────── */
    #mask-overlay{position:fixed;inset:0;z-index:45;background:url('freddy_mask.png') center/cover no-repeat;pointer-events:none;transform:translateY(-100%);transition:transform 0.25s ease-out}
    #mask-overlay.on{transform:translateY(0)}

    /* ─────────── HUD ELEMENTS ─────────── */
    #hud-container{position:fixed;top:4vh;right:3vw;z-index:60;text-align:right;pointer-events:none;color:#e8e8c8;text-shadow:0 0 8px rgba(0,0,0,0.95)}
    #time-display{font-size:clamp(20px,2.6vw,40px);font-weight:700}
    #night-display{font-size:clamp(11px,1.3vw,20px);color:rgba(210,210,185,0.65)}
    #flashlight-hud{position:fixed;bottom:4vh;left:3vw;z-index:60;color:#e8e8c8;font-size:clamp(14px,1.5vw,22px)}
    #flashlight-bar-bg{width:120px;height:12px;border:1px solid #e8e8c8;margin-top:4px;background:rgba(0,0,0,0.5)}
    #flashlight-bar-fill{width:100%;height:100%;background:#60ff80}

    /* ─────────── CAMERA SYSTEM ─────────── */
    #camera-ui{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:#000;transform:translateY(100%);transition:transform 0.3s ease-out}
    #camera-ui.open{transform:translateY(0)}
    #cam-feed{flex:1;position:relative;overflow:hidden}
    #cam-feed-img{width:100%;height:100%;object-fit:cover}
    #cam-label{position:absolute;top:14px;left:20px;z-index:5;font-size:clamp(14px,2vw,26px);color:rgba(160,255,180,0.85)}
    #wind-music-box{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);z-index:10;padding:12px 24px;font-family:'Oswald',sans-serif;font-size:18px;color:#fff;background:rgba(180,40,40,0.8);border:2px solid #ff6666;cursor:pointer;display:none}

    /* Camera Map */
    #cam-map{position:absolute;bottom:14px;right:14px;z-index:6;background:rgba(0,0,0,0.85);border:1px solid rgba(100,200,120,0.3);padding:8px}
    .map-room{cursor:pointer}
    .map-room rect{fill:rgba(20,35,24,0.9);stroke:rgba(100,200,120,0.4)}
    .map-room.active rect{fill:rgba(50,150,70,0.6);stroke:rgba(120,255,140,0.9)}
    .map-id{font-size:10px;fill:#a0ffa0;text-anchor:middle}

    /* ─────────── HOVER TRIGGERS ─────────── */
    #hover-cam-trigger{position:fixed;bottom:0;left:35%;width:30%;height:6vh;z-index:55;background:rgba(255,255,255,0.1);border-top:2px solid rgba(255,255,255,0.4);text-align:center;color:#fff;line-height:6vh;letter-spacing:2px}
    #hover-mask-trigger{position:fixed;bottom:0;left:0;width:30%;height:6vh;z-index:55;background:rgba(255,255,255,0.05);border-top:2px solid rgba(255,255,255,0.2);text-align:center;color:#aaa;line-height:6vh;letter-spacing:2px}

    /* ─────────── SCREENS ─────────── */
    #jumpscare-overlay{position:fixed;inset:0;z-index:200;background:#000;display:none;align-items:center;justify-content:center}
    #jumpscare-overlay.active{display:flex}
    #jumpscare-img{width:100%;height:100%;object-fit:cover}
    #game-over-screen{position:fixed;inset:0;z-index:250;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;color:#800;font-family:'Creepster',cursive;font-size:60px}

    /* Custom Cursor */
    #cursor{position:fixed;width:16px;height:16px;border:2px solid rgba(255,255,255,0.8);border-radius:50%;pointer-events:none;z-index:600;transform:translate(-50%,-50%)}
  </style>
</head>
<body>

  <canvas id="noise"></canvas>
  <div id="scanlines"></div>
  <div id="vignette"></div>

  <div class="title-block">
    <div class="title-line">FIVE NIGHTS</div>
    <div class="title-line">AT STUARTS</div>
    <div class="title-num">2</div>
  </div>

  <ul id="menu">
    <li id="menu-new" class="active selected">New Game</li>
    <li id="menu-continue" class="inactive">Continue</li>
  </ul>

  <div id="hint">PRESS & HOLD DELETE TO RESET DATA</div>

  <img src="stuart.png" alt="Stuart silhouette" class="stuart-silhouette">

  <div id="flash"></div>

  <video id="secret-vid" src="crucifix.mp4" playsinline></video>

  <audio id="menu-music" src="menu_music.mp3" loop></audio>

  <div id="game-container">
    <div id="room-wrapper">
      <img id="room-img" src="room.png" alt="Office">
    </div>

    <img id="peek-left" class="peek-zone" src="bonnie.png" alt="Left Vent Animatronic">
    <img id="peek-right" class="peek-zone" src="chica.png" alt="Right Vent Animatronic">
    <img id="peek-center" class="peek-zone" src="freddy.png" alt="Hallway Animatronic">

    <div id="dark-overlay"></div>
    <div id="mask-overlay"></div>

    <div id="hud-container">
      <div id="time-display">12 AM</div>
      <div id="night-display">NIGHT 1</div>
    </div>
    
    <div id="flashlight-hud">
      POWER
      <div id="flashlight-bar-bg"><div id="flashlight-bar-fill"></div></div>
    </div>

    <div id="hover-mask-trigger">MASK</div>
    <div id="hover-cam-trigger">MONITOR</div>

    <div id="camera-ui">
      <div id="cam-feed">
        <img id="cam-feed-img" src="" alt="Camera Feed">
        <div id="cam-label">CAM 11 - PRIZE CORNER</div>
        <button id="wind-music-box">WIND MUSIC BOX</button>
        
        <div id="cam-map">
          <svg viewBox="0 0 300 250" width="260" height="200">
            <g class="map-room" data-cam="09"><rect x="210" y="20" width="70" height="30"/><text x="245" y="38" class="map-id">CAM 09</text></g>
            <g class="map-room" data-cam="10"><rect x="210" y="75" width="70" height="30"/><text x="245" y="93" class="map-id">CAM 10</text></g>
            <g class="map-room active" data-cam="11"><rect x="210" y="130" width="70" height="30"/><text x="245" y="148" class="map-id">CAM 11</text></g>
            <g class="map-room" data-cam="12"><rect x="210" y="185" width="70" height="30"/><text x="245" y="203" class="map-id">CAM 12</text></g>
            <g class="map-room" data-cam="07"><rect x="115" y="25" width="70" height="40"/><text x="150" y="48" class="map-id">CAM 07</text></g>
            <g class="map-room" data-cam="08"><rect x="115" y="90" width="70" height="40"/><text x="150" y="113" class="map-id">CAM 08</text></g>
            <g class="map-room" data-cam="01"><rect x="20" y="20" width="70" height="30"/><text x="55" y="38" class="map-id">CAM 01</text></g>
            <g class="map-room" data-cam="02"><rect x="20" y="75" width="70" height="30"/><text x="55" y="93" class="map-id">CAM 02</text></g>
            <g class="map-room" data-cam="05"><rect x="90" y="210" width="50" height="25"/><text x="115" y="226" class="map-id">CAM 05</text></g>
            <g class="map-room" data-cam="06"><rect x="160" y="210" width="50" height="25"/><text x="185" y="226" class="map-id">CAM 06</text></g>
          </svg>
        </div>
      </div>
    </div>

    <div id="jumpscare-overlay"><img id="jumpscare-img" src="" alt="Jumpscare"></div>
    <div id="game-over-screen">GAME OVER</div>
  </div>

  <div id="cursor"></div>

  <script>
    /* ────── NOISE CANVAS ────── */
    const noiseCanvas=document.getElementById('noise');
    const nCtx=noiseCanvas.getContext('2d');
    function sizeNoise(){noiseCanvas.width=innerWidth;noiseCanvas.height=innerHeight}
    sizeNoise();addEventListener('resize',sizeNoise);
    function drawNoise(){const {width:w,height:h}=noiseCanvas;const id=nCtx.createImageData(w,h);for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}nCtx.putImageData(id,0,0)}
    setInterval(drawNoise,90);

    /* ────── ENGINE STATE & AI ────── */
    const STATE = {
      night: 1,
      hour: 0,
      timeTicks: 0,
      flashPower: 100,
      isFlashOn: false,
      isCamOpen: false,
      isMaskOn: false,
      currentCam: '11',
      musicBox: 100,
      gameOver: false,
      gameStarted: false,
      panX: -90
    };

    const AI = {
      ToyBonnie:   { path: ['09', '03', '04', '02', '06', 'office_vent'], pos: '09', level: 3 },
      ToyChica:    { path: ['09', '07', '04', '01', '05', 'office_vent'], pos: '09', level: 2 },
      WitheredFoxy:{ path: ['08', 'hallway'], pos: '08', level: 4 }
    };

    /* ────── DOM HANDLES ────── */
    const DOM = {
      newBtn: document.getElementById('menu-new'),
      contBtn: document.getElementById('menu-continue'),
      flash: document.getElementById('flash'),
      music: document.getElementById('menu-music'),
      secretVid: document.getElementById('secret-vid'),
      gameContainer: document.getElementById('game-container'),
      titleBlock: document.querySelector('.title-block'),
      menuList: document.getElementById('menu'),
      hint: document.getElementById('hint'),
      stuartSilhouette: document.querySelector('.stuart-silhouette'),
      roomWrapper: document.getElementById('room-wrapper'),
      roomImg: document.getElementById('room-img'),
      cursor: document.getElementById('cursor'),
      camUi: document.getElementById('camera-ui'),
      camImg: document.getElementById('cam-feed-img'),
      camLabel: document.getElementById('cam-label'),
      mask: document.getElementById('mask-overlay'),
      flashFill: document.getElementById('flashlight-bar-fill'),
      timeDisplay: document.getElementById('time-display'),
      nightDisplay: document.getElementById('night-display'),
      windBtn: document.getElementById('wind-music-box'),
      peekLeft: document.getElementById('peek-left'),
      peekRight: document.getElementById('peek-right'),
      peekCenter: document.getElementById('peek-center'),
      jumpscare: document.getElementById('jumpscare-overlay'),
      jumpscareImg: document.getElementById('jumpscare-img'),
      gameOver: document.getElementById('game-over-screen')
    };

    /* ────── MENU NAVIGATION LOGIC ────── */
    const menuItems = [DOM.newBtn, DOM.contBtn];
    let sel = 0;

    function updateMenu(){
      menuItems.forEach((li,i) => li.classList.toggle('selected', i === sel));
    }

    // Save Data Handling
    const saved = parseInt(localStorage.getItem('fnafSaveNight') || '0');
    if (saved > 1) {
      DOM.contBtn.classList.remove('inactive');
      DOM.contBtn.classList.add('active');
      DOM.contBtn.dataset.night = saved;
    }

    // Delete Hold Data Reset
    let holdReset = false, resetHold = 0;
    setInterval(() => {
      if (holdReset) {
        resetHold += 100;
        if (resetHold > 2000) {
          localStorage.removeItem('fnafSaveNight');
          location.reload();
        }
      } else {
        resetHold = 0;
      }
    }, 100);

    // Keydown Controls
    addEventListener('keydown', e => {
      if (secretActive) return;

      if (!STATE.gameStarted) {
        if (['ArrowUp','w','W'].includes(e.key)) { sel = (sel - 1 + menuItems.length) % menuItems.length; updateMenu(); }
        if (['ArrowDown','s','S'].includes(e.key)) { sel = (sel + 1) % menuItems.length; updateMenu(); }
        if (e.key === 'Enter' || e.key === ' ') { activate(menuItems[sel]); }
        if (e.key === 'Delete') { holdReset = true; }
      } else {
        if (e.code === 'ControlLeft' || e.code === 'ControlRight' || e.code === 'KeyF') {
          if (STATE.flashPower > 0 && !STATE.isMaskOn) {
            STATE.isFlashOn = true;
            updateLighting();
          }
        }
      }
    });

    addEventListener('keyup', e => {
      if (e.key === 'Delete') { holdReset = false; resetHold = 0; }
      if (STATE.gameStarted && (e.code === 'ControlLeft' || e.code === 'ControlRight' || e.code === 'KeyF')) {
        STATE.isFlashOn = false;
        updateLighting();
      }
    });

    menuItems.forEach(li => li.addEventListener('mouseover', () => {
      if (!STATE.gameStarted) { sel = menuItems.indexOf(li); updateMenu(); }
    }));

    menuItems.forEach(li => li.addEventListener('click', () => {
      if (!STATE.gameStarted) activate(li);
    }));

    function activate(li) {
      if (li.id === 'menu-new') {
        transition(() => startInGame(1));
      } else if (li.id === 'menu-continue' && li.classList.contains('active')) {
        const n = parseInt(DOM.contBtn.dataset.night || '1');
        transition(() => startInGame(n));
      }
    }

    function transition(cb) {
      DOM.flash.style.opacity = '1';
      setTimeout(() => {
        DOM.flash.style.opacity = '0';
        cb();
      }, 140);
    }

    /* ────── AMBIENT MUSIC ────── */
    DOM.music.volume = 0.45;
    DOM.music.play().catch(() => {
      const starter = () => {
        if (!STATE.gameStarted) DOM.music.play().catch(() => {});
        removeEventListener('click', starter);
        removeEventListener('keydown', starter);
      };
      addEventListener('click', starter);
      addEventListener('keydown', starter);
    });

    /* ────── SECRET WORD TRIGGER ("stuart") ────── */
    let keyBuffer = '';
    let secretActive = false;

    addEventListener('keydown', e => {
      if (secretActive) return;
      if (e.key.length === 1) {
        keyBuffer += e.key.toLowerCase();
        if (keyBuffer.length > 6) keyBuffer = keyBuffer.slice(-6);
        if (keyBuffer === 'stuart') triggerSecret();
      }
    });

    function triggerSecret() {
      secretActive = true;
      DOM.music.pause();
      Array.from(document.body.children).forEach(el => {
        if (el.id !== 'secret-vid' && el.id !== 'cursor') el.style.display = 'none';
      });
      DOM.secretVid.style.display = 'block';
      DOM.secretVid.currentTime = 0;
      DOM.secretVid.play().catch(() => {});

      DOM.secretVid.onended = () => {
        Array.from(document.body.children).forEach(el => {
          if (el.id !== 'secret-vid' && el.id !== 'game-container') el.style.display = '';
        });
        if (STATE.gameStarted) DOM.gameContainer.style.display = 'block';
        DOM.secretVid.style.display = 'none';
        secretActive = false;
        if (!STATE.gameStarted) DOM.music.play().catch(() => {});
        keyBuffer = '';
      };
    }

    /* ────── TRANSITION INTO GAME ────── */
    function startInGame(nightNum) {
      STATE.gameStarted = true;
      STATE.night = nightNum;
      DOM.nightDisplay.textContent = `NIGHT ${STATE.night}`;

      DOM.music.pause();
      DOM.music.currentTime = 0;

      DOM.titleBlock.style.display = 'none';
      DOM.menuList.style.display = 'none';
      DOM.hint.style.display = 'none';
      DOM.stuartSilhouette.style.display = 'none';

      DOM.gameContainer.style.display = 'block';
      initGameLoops();
    }

    /* ────── IN-GAME ENGINE MECHANICS ────── */
    window.addEventListener('mousemove', (e) => {
      DOM.cursor.style.left = `${e.clientX}px`;
      DOM.cursor.style.top = `${e.clientY}px`;
      
      if(STATE.gameStarted && !STATE.isCamOpen && !STATE.gameOver) {
        const percent = e.clientX / window.innerWidth;
        STATE.panX = -30 - (percent * 120);
        DOM.roomWrapper.style.transform = `translateX(${STATE.panX}vw) scale(0.6)`;
      }
    });

    function updateLighting() {
      if (STATE.isFlashOn && STATE.flashPower > 0) {
        DOM.roomImg.classList.add('lit');
        STATE.flashPower = Math.max(0, STATE.flashPower - 0.05);
        DOM.flashFill.style.width = `${STATE.flashPower}%`;
      } else {
        DOM.roomImg.classList.remove('lit');
      }
      renderOfficePeeks();
    }

    document.getElementById('hover-cam-trigger').addEventListener('mouseenter', () => {
      if (!STATE.gameStarted || STATE.isMaskOn || STATE.gameOver) return;
      STATE.isCamOpen = !STATE.isCamOpen;
      DOM.camUi.classList.toggle('open', STATE.isCamOpen);
      updateCameraFeed();
    });

    document.getElementById('hover-mask-trigger').addEventListener('mouseenter', () => {
      if (!STATE.gameStarted || STATE.isCamOpen || STATE.gameOver) return;
      STATE.isMaskOn = !STATE.isMaskOn;
      DOM.mask.classList.toggle('on', STATE.isMaskOn);
      renderOfficePeeks();
    });

    document.querySelectorAll('.map-room').forEach(el => {
      el.addEventListener('click', () => {
        document.querySelectorAll('.map-room').forEach(r => r.classList.remove('active'));
        el.classList.add('active');
        STATE.currentCam = el.dataset.cam;
        DOM.camLabel.textContent = `CAM ${STATE.currentCam}`;
        DOM.windBtn.style.display = (STATE.currentCam === '11') ? 'block' : 'none';
        updateCameraFeed();
      });
    });

    DOM.windBtn.addEventListener('mousedown', () => {
      if (STATE.isCamOpen && STATE.currentCam === '11') {
        STATE.musicBox = Math.min(100, STATE.musicBox + 3);
      }
    });

    function updateCameraFeed() {
      if (!STATE.isCamOpen) return;
      DOM.camImg.src = `cam_${STATE.currentCam}.png`;
    }

    function renderOfficePeeks() {
      const lit = STATE.isFlashOn;
      DOM.peekRight.style.display = (lit && AI.ToyBonnie.pos === 'office_vent') ? 'block' : 'none';
      DOM.peekLeft.style.display  = (lit && AI.ToyChica.pos === 'office_vent') ? 'block' : 'none';
      DOM.peekCenter.style.display = (lit && AI.WitheredFoxy.pos === 'hallway') ? 'block' : 'none';
    }

    function initGameLoops() {
      setInterval(() => {
        if (STATE.gameOver || !STATE.gameStarted) return;

        Object.keys(AI).forEach(key => {
          const char = AI[key];
          if (!char.path) return;

          const roll = Math.floor(Math.random() * 20) + 1;
          if (roll <= char.level) {
            let currentIndex = char.path.indexOf(char.pos);
            if (currentIndex < char.path.length - 1) {
              char.pos = char.path[currentIndex + 1];
            }
          }
        });

        checkOfficeIntrusions();
      }, 4970);

      setInterval(() => {
        if (STATE.gameOver || !STATE.gameStarted) return;

        STATE.timeTicks++;
        if (STATE.timeTicks % 60 === 0) {
          STATE.hour = (STATE.hour + 1) % 12;
          DOM.timeDisplay.textContent = `${STATE.hour === 0 ? 12 : STATE.hour} AM`;
        }

        STATE.musicBox = Math.max(0, STATE.musicBox - 0.15);
        if (STATE.musicBox <= 0) {
          triggerJumpscare('puppet.png');
        }

        if (STATE.isFlashOn) updateLighting();
      }, 1000);
    }

    function checkOfficeIntrusions() {
      if (AI.WitheredFoxy.pos === 'hallway' && !STATE.isFlashOn && Math.random() < 0.3) {
        triggerJumpscare('foxy.png');
      }

      ['ToyBonnie', 'ToyChica'].forEach(name => {
        const anim = AI[name];
        if (anim.pos === 'office_vent') {
          setTimeout(() => {
            if (!STATE.isMaskOn) {
              triggerJumpscare(`${name.toLowerCase()}.png`);
            } else {
              anim.pos = anim.path[0];
              renderOfficePeeks();
            }
          }, 2500);
        }
      });
    }

    function triggerJumpscare(imgSrc) {
      STATE.gameOver = true;
      DOM.jumpscareImg.src = imgSrc;
      DOM.jumpscare.classList.add('active');
      
      setTimeout(() => {
        DOM.jumpscare.classList.remove('active');
        DOM.gameOver.style.display = 'flex';
      }, 2000);
    }
  </script>
</body>
</html>
