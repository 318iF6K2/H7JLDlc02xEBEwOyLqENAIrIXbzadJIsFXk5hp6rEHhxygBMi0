<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Commissions - Crazyben</title>
  <link rel="icon" type="image/png" href="CSNew4.png" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b132b;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background-color: rgba(11, 19, 43, 0.92);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 12px 6%;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 25px;
    }

    nav a {
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      transition: color 0.2s;
    }

    nav a:hover {
      color: #00b4d8;
    }

    .commission-container {
      flex: 1;
      max-width: 650px;
      margin: 120px auto 60px auto;
      padding: 40px;
      background: #1c2541;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .commission-container h1 {
      font-size: 2rem;
      color: #caf0f8;
      margin-bottom: 12px;
    }

    .commission-info {
      color: #90e0ef;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #caf0f8;
      font-size: 0.9rem;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      background-color: #0b132b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #00b4d8;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 140px;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #00b4d8 0%, #0077b6 100%);
      color: #ffffff;
      padding: 14px;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 180, 216, 0.5);
    }

    .btn-submit:disabled {
      background: #4a5568;
      color: #a0aec0;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .status-msg {
      margin-top: 15px;
      font-size: 0.9rem;
      text-align: center;
    }

    footer {
      background-color: #070a13;
      text-align: center;
      padding: 30px 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .copyright {
      font-size: 0.8rem;
      color: #5c6b73;
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="https://www.roblox.com/users/946447734/profile" target="_blank">Roblox Profile</a></li>
        <li><a href="https://discord.gg/XgdCf2AfPU" target="_blank">Discord</a></li>
        <li><a href="https://www.roblox.com/communities/5077085" target="_blank">Skygaze Studio</a></li>
        <li><a href="commissions.html">Commissions</a></li>
      </ul>
    </nav>
  </header>

  <div class="commission-container">
    <h1>Request a Commission</h1>
    <p class="commission-info">
      You may also directly message <strong>_crazyben</strong> on Discord, but this is also another way to get in contact with me. It may take up to a week for me to reply if you contact me via here.
    </p>

    <form id="commissionForm">
      <div class="form-group">
        <label for="contactInfo">Email or Discord Username</label>
        <input type="text" id="contactInfo" name="contactInfo" placeholder="e.g. user@example.com or _crazyben" required />
      </div>

      <div class="form-group">
        <label for="details">Project Details / What You Need</label>
        <textarea id="details" name="details" placeholder="Describe your project, features required, deadlines, etc." required></textarea>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Send Request</button>
      <div id="statusMsg" class="status-msg"></div>
    </form>
  </div>

  <footer>
    <div class="copyright">crazyben.dev</div>
  </footer>

  <script>
    const form = document.getElementById('commissionForm');
    const statusMsg = document.getElementById('statusMsg');
    const submitBtn = document.getElementById('submitBtn');
    const COOLDOWN_TIME = 5 * 60 * 1000; // 5 minutes in milliseconds

    function checkCooldown() {
      const lastSubmit = localStorage.getItem('lastCommissionTime');
      if (lastSubmit) {
        const timePassed = Date.now() - parseInt(lastSubmit, 10);
        if (timePassed < COOLDOWN_TIME) {
          const remainingMinutes = Math.ceil((COOLDOWN_TIME - timePassed) / 60000);
          submitBtn.disabled = true;
          statusMsg.style.color = '#ff6b6b';
          statusMsg.innerText = `Please wait ${remainingMinutes} minute(s) before sending another request.`;
          return true;
        }
      }
      return false;
    }

    checkCooldown();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      if (checkCooldown()) return;

      const contact = document.getElementById('contactInfo').value.trim();
      const details = document.getElementById('details').value.trim();

      submitBtn.disabled = true;
      submitBtn.innerText = 'Sending...';
      statusMsg.style.color = '#caf0f8';
      statusMsg.innerText = '';

      try {
        const response = await fetch('/api/submit-commission', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contact, details })
        });

        const result = await response.json();

        if (response.ok) {
          localStorage.setItem('lastCommissionTime', Date.now().toString());
          statusMsg.style.color = '#4efaaf';
          statusMsg.innerText = 'Request submitted successfully!';
          form.reset();
          checkCooldown();
        } else {
          statusMsg.style.color = '#ff6b6b';
          statusMsg.innerText = result.message || 'Failed to send request.';
        }
      } catch (err) {
        statusMsg.style.color = '#ff6b6b';
        statusMsg.innerText = 'Error submitting request. Please try direct messaging on Discord.';
      } finally {
        if (!submitBtn.disabled) {
          submitBtn.innerText = 'Send Request';
        }
      }
    });
  </script>

</body>
</html>
